<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zalo Webhook Diagnostic</title><style>body{font-family:system-ui;max-width:850px;margin:auto;padding:20px;background:#f5f6f8}.c{background:white;padding:18px;margin:12px 0;border-radius:14px}button{padding:12px 16px;margin:4px;border:0;border-radius:9px;background:#111;color:white}input{padding:12px;width:100%;box-sizing:border-box}pre{background:#111;color:#d8ffd8;padding:15px;white-space:pre-wrap}</style><div class=c><h2>Zalo Bot Webhook Diagnostic</h2><b id=u></b></div><div class=c><input id=k type=password placeholder="ADMIN_KEY"></div><div class=c><button onclick="go('getMe')">Get Me</button><button onclick="go('getWebhookInfo')">Get Webhook Info</button><button onclick="go('setWebhook')">Cài Webhook này</button><button onclick="go('deleteWebhook')">Xóa Webhook</button></div><div class=c><pre id=r>Chưa có kết quả.</pre></div><script>u.textContent=location.origin+"/webhook";async function go(action){r.textContent="Đang gọi "+action+"...";try{let x=await fetch("/api/control",{method:"POST",headers:{"Content-Type":"application/json","X-Admin-Key":k.value},body:JSON.stringify({action})});let t=await x.text();try{t=JSON.stringify(JSON.parse(t),null,2)}catch(e){}r.textContent="HTTP "+x.status+"\n"+t}catch(e){r.textContent=String(e)}}</script></html>
